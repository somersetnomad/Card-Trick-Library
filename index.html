function rehearse(t){
  const ov=document.getElementById('overlay');let i=0,start=Date.now(),wl=null;
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}
  ov.innerHTML=`<div class="rehearse" role="dialog" aria-label="Rehearsal mode"><div class="rtop"><span class="label">${esc(t.name)} · Rehearsal</span><span class="timer" id="tm">0:00</span><button class="btn line" id="rx">Exit</button></div>
    <div class="stage"><div class="stepno" id="sn"></div><div class="steptext" id="st"></div><div class="prog"><i id="pg"></i></div></div>
    <div class="rbot"><button class="btn line" id="rp">← Back</button><button class="btn" id="rn">Next step →</button></div></div>`;
  const tm=setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);document.getElementById('tm').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
  const draw=()=>{document.getElementById('sn').textContent=`${i+1} / ${t.steps.length}`;document.getElementById('st').textContent=t.steps[i];document.getElementById('pg').style.width=((i+1)/t.steps.length*100)+'%';
    document.getElementById('rp').disabled=i===0;document.getElementById('rn').textContent=i===t.steps.length-1?'Finish and log':'Next step →'};
  const close=(log)=>{clearInterval(tm);document.removeEventListener('keydown',key);try{wl&&wl.release()}catch(e){}
    if(log){const mins=(Date.now()-start)/60000;track('rehearsal',t.id+':'+Date.now());logPractice(t.id,mins,'Rehearsal');toast(`Rehearsal logged: ${Math.max(1,Math.round(mins))} min`)}ov.innerHTML=''};
  const next=()=>{if(i<t.steps.length-1){i++;draw()}else close(true)};
  const key=e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'&&i>0){i--;draw()}if(e.key==='Escape')close(false)};
  document.addEventListener('keydown',key);
  document.getElementById('rn').onclick=next;document.getElementById('rp').onclick=()=>{if(i>0){i--;draw()}};document.getElementById('rx').onclick=()=>close(false);
  draw();document.getElementById('rn').focus();
}

/* ===== drills ===== */
function orderDrill(t,el){
  let order,next,mistakes,start;
  const begin=()=>{order=shuffle(t.steps.map((s,k)=>k));next=0;mistakes=0;start=Date.now();draw()};
  function draw(){
    el.innerHTML=`<ol class="answered">${t.steps.slice(0,next).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    ${next<t.steps.length?`<div class="chips">${order.map(k=>`<button class="chip ${k<next?'done':''}" data-k="${k}" ${k<next?'disabled':''}>${esc(t.steps[k])}</button>`).join('')}</div><p class="stat" style="margin-top:12px">STEP ${next+1} OF ${t.steps.length} · MISTAKES ${mistakes}</p>`:''}`;
    el.querySelectorAll('.chip:not(.done)').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k===next){next++;if(next===t.steps.length)finish();else draw()}else{mistakes++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');el.querySelector('.stat').textContent=`STEP ${next+1} OF ${t.steps.length} · MISTAKES ${mistakes}`}});
  }
  function finish(){const s=Math.round((Date.now()-start)/1000);const pass=mistakes===0;
    if(pass)track('drill','order:'+t.id);
    if(pass&&(mastery[t.id]||0)<1){mastery[t.id]=1;saveM();toast('Mastery level 1 reached')}
    const best=store.get('best-'+t.id,null);if(pass&&(!best||s<best))store.set('best-'+t.id,s);
    draw();el.insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:8px"><span style="font-size:1.1rem">${pass?'<b style="color:var(--good)">Perfect.</b>':`<b style="color:var(--red)">${mistakes} mistake${mistakes>1?'s':''}.</b>`} ${s} seconds.${store.get('best-'+t.id,null)?` Best clean run: ${store.get('best-'+t.id)} s.`:''}</span><button class="btn" id="again">Try again</button></div>`);
    el.querySelector('#again').onclick=begin;
    const ladder=document.getElementById('ladder');if(ladder)drawLadder(t,ladder);}
  begin();
}
function spellDrill(t,el){
  let q,score,start,cur;
  const begin=()=>{q=0;score=0;start=Date.now();ask()};
  function ask(){
    if(q===10){if(score===10)track('drill','spell');const s=Math.round((Date.now()-start)/1000);const best=store.get('spellbest',null);if(score===10&&(!best||s<best))store.set('spellbest',s);
      el.innerHTML=`<p style="font-size:1.15rem;margin:0 0 12px"><b style="color:var(--gold)">${score} / 10</b> in ${s} seconds.${store.get('spellbest',null)?` Best perfect run: ${store.get('spellbest')} s.`:''}</p><button class="btn" id="go">Go again</button>`;el.querySelector('#go').onclick=begin;return}
    cur={r:RANKS[rnd(0,12)],s:'SHDC'[rnd(0,3)]};const ans=lettersOf(cur);
    el.innerHTML=`<p class="stat">QUESTION ${q+1} OF 10 · SCORE ${score}</p><p style="font-family:var(--display);font-size:1.6rem;margin:8px 0 14px;color:${isRed(cur.s)?'var(--red)':'var(--ink)'}">${nameOf(cur)}</p>
      <div class="opts">${[10,11,12,13,14,15].map(n=>`<button class="opt" data-n="${n}">${n}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;b.classList.add(n===ans?'ok':'no');if(n===ans)score++;else el.querySelector(`.opt[data-n="${ans}"]`).classList.add('ok');
      el.querySelectorAll('.opt').forEach(x=>x.disabled=true);q++;setTimeout(ask,n===ans?350:1100)});
  }
  el.innerHTML=`<button class="btn" id="go">Start the drill</button>`;el.querySelector('#go').onclick=begin;
}
function keyDrill(t,el){
  let round,hits,start;
  const begin=()=>{round=0;hits=0;start=Date.now();ask()};
  function ask(){
    if(round===8){if(hits===8)track('drill','key');const s=Math.round((Date.now()-start)/1000);el.innerHTML=`<p style="font-size:1.15rem;margin:0 0 12px"><b style="color:var(--gold)">${hits} / 8</b> found in ${s} seconds. Professionals locate it in under two seconds each.</p><button class="btn" id="go">Go again</button>`;el.querySelector('#go').onclick=begin;return}
    let deck=shuffle(fullDeck()).slice(0,18);const ki=rnd(0,17);const key=deck[ki];
    // spread shows face card (bottom) at left; selection is directly beneath the key = one step towards the face (left), wrapping
    const spread=[...deck].reverse();const kpos=spread.indexOf(key);const ans=(kpos-1+spread.length)%spread.length;
    el.innerHTML=`<p class="stat">ROUND ${round+1} OF 8 · FOUND ${hits}</p><p style="margin:6px 0">Your key card is <b style="color:${isRed(key.s)?'var(--red)':'var(--gold)'}">${key.r}${SUITS[key.s]}</b>. Tap their card. The face card of the deck is on the left.</p>
      <div class="spread">${spread.map((c,k)=>mini(c,'','button',`data-k="${k}" aria-label="${c.r} of ${SUITNAME[c.s].toLowerCase()}"`)).join('')}</div>`;
    el.querySelectorAll('.spread .card').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const ok=k===ans;if(ok)hits++;
      b.classList.add(ok?'hl':'hlr');el.querySelector(`.spread .card[data-k="${ans}"]`).classList.add('hl');el.querySelector(`.spread .card[data-k="${kpos}"]`).style.transform='translateY(-8px)';
      el.querySelectorAll('.spread .card').forEach(x=>x.disabled=true);round++;setTimeout(ask,ok?500:1500)});
  }
  el.innerHTML=`<button class="btn" id="go">Start the drill</button><p class="muted" style="margin:10px 0 0;font-size:.95rem">Remember the edge case: if the key is the face card, their card is at the far right end.</p>`;el.querySelector('#go').onclick=begin;
}

/* ===== laboratory ===== */
function meter(label,ok,total,good,note){const pct=Math.round(ok/total*100);return `<div class="meter"><span class="label">${label}</span><div class="big ${good?'ok':'bad'}">${pct}%</div><div class="bar"><i style="width:${pct}%;background:${good?'var(--good)':'var(--red)'}"></i></div><p>${ok.toLocaleString()} of ${total.toLocaleString()} worked. ${note}</p></div>`}
const LABS={
  t21:{intro:'Every one of the 21 cards is chosen in turn and run through three deals. Then the same test with one mistake: dealing down the columns instead of across the rows.',
    run(){const sim=(across)=>{let ok=0;for(let s=0;s<21;s++){let idx=s;for(let r=0;r<3;r++){const row=across?Math.floor(idx/3):idx%7;idx=7+row}if(idx===10)ok++}return ok};
      return [['Done correctly',sim(true),21,true,'Always position 11.'],['Dealt down the columns',sim(false),21,false,'The card never moves towards the centre.']]}},
  key:{intro:'A thousand random selections, each followed by one to five random complete cuts. Then a thousand where the spectator gives one riffle shuffle instead.',
    run(){let a=0,b=0;for(let n=0;n<1000;n++){let d=[...Array(52).keys()];const key=d[51];const sel=d.splice(rnd(0,50),1)[0];d.unshift(sel);
        let x=[...d];for(let c=rnd(1,5);c>0;c--){const k=rnd(1,51);x=[...x.slice(k),...x.slice(0,k)]}const ki=x.indexOf(key);if(x[(ki+1)%52]===sel)a++;
        const k=rnd(20,32);const y=riffle(d.slice(0,k),d.slice(k));const kj=y.indexOf(key);if(y[(kj+1)%52]===sel)b++;}
      return [['Complete cuts only',a,1000,true,'Neighbours survive every cut.'],['One riffle shuffle',b,1000,false,'The riffle separates the key from their card.']]}},
  aces:{intro:'A thousand random cuts into four piles, handled in the correct order. Then a thousand where the ace pile is handled first instead of last.',
    run(){const sim=(aceFirst)=>{let ok=0;for(let n=0;n<1000;n++){const d=['A','A','A','A',...Array(48).fill('x')];const a=rnd(8,18),b=rnd(8,18),c=rnd(8,18);
        const piles=[d.slice(0,a),d.slice(a,a+b),d.slice(a+b,a+b+c),d.slice(a+b+c)];const order=aceFirst?[0,1,2,3]:[1,2,3,0];
        for(const p of order){let P=piles[p];P=[...P.slice(3),...P.slice(0,3)];piles[p]=P;for(let q=0;q<4;q++)if(q!==p)piles[q].unshift(piles[p].shift())}
        if(piles.every(p=>p[0]==='A'))ok++}return ok};
      return [['Ace pile handled last',sim(false),1000,true,'Four aces every time.'],['Ace pile handled first',sim(true),1000,false,'"Three to the bottom" buries the aces.']]}},
  gilbreath:{intro:'A thousand random deals and genuinely random riffles. Then a thousand where the pile is cut off as a block instead of dealt one card at a time.',
    run(){const sim=(deal)=>{let ok=0;for(let n=0;n<1000;n++){const d=[...Array(52).keys()].map(i=>i%2);const k=rnd(10,42);const pile=deal?d.slice(0,k).reverse():d.slice(0,k);const out=riffle(pile,d.slice(k));
        let good=true;for(let i=0;i<52;i+=2)if(out[i]===out[i+1]){good=false;break}if(good)ok++}return ok};
      return [['Dealt one at a time',sim(true),1000,true,'Every pair mixed, every time.'],['Cut off as a block',sim(false),1000,false,'Fails whenever the block size gives matching tops.']]}},
  spell:{intro:'Every one of the 52 cards at every starting position in the packet. Can the card always be moved to match its name? First with 20 cards, then with only 12.',
    run(){const sim=(n)=>{let ok=0,tot=0;for(const c of fullDeck())for(let p=1;p<=n;p++){tot++;if(lettersOf(c)<=n)ok++}return [ok,tot]};const [a,at]=sim(20),[b,bt]=sim(12);
      return [['A 20-card packet',a,at,true,'Every name fits.'],['A 12-card packet',b,bt,false,'Long names like SEVEN OF DIAMONDS don’t fit.']]}}
};
Object.assign(LABS,{
  howold:{intro:'Every number from 10 to 19 is tried. Then the same card is used for numbers from 20 to 29, which needs a different position.',
    run(){const sim=(a,b)=>{let ok=0;for(let n=a;n<=b;n++){const pile=[...Array(n)].map((_,i)=>i+1).reverse();const s=String(n).split('').reduce((x,d)=>x+ +d,0);if(pile[s]===9)ok++}return ok};
      return [['Numbers 10 to 19',sim(10,19),10,true,'Always the 9th card.'],['Numbers 20 to 29',sim(20,29),10,false,'These land on the 18th card instead.']]}},
  gergonne:{intro:'All 27 scores are tried with all 27 possible thought-of cards, using the table. Then the same with the chosen pile always in the middle.',
    run(){const sim=(useTable)=>{let ok=0;for(let N=1;N<=27;N++){const T=N-1,ks=useTable?[T%3,Math.floor(T/3)%3,Math.floor(T/9)]:[1,1,1];for(let s=0;s<27;s++){let idx=s;ks.forEach(k=>{idx=9*k+Math.floor(idx/3)});if(idx===T)ok++}}return ok};
      return [['Following the table',sim(true),729,true,'Every card lands on every score.'],['Always the middle',sim(false),729,false,'Only works if the score happens to be 14.']]}},
  squad:{intro:'A thousand random deals and riffles of a deck with suits in repeating order. Then a thousand where the pile is cut off as a block instead of dealt.',
    run(){const sim=(deal)=>{let ok=0;for(let n=0;n<1000;n++){let d=[...Array(52).keys()].map(i=>i%4);const c=rnd(0,51);d=[...d.slice(c),...d.slice(0,c)];const k=rnd(1,51);const out=riffle(deal?d.slice(0,k).reverse():d.slice(0,k),d.slice(k));let g=true;for(let i=0;i<52;i+=4)if(new Set(out.slice(i,i+4)).size!==4){g=false;break}if(g)ok++}return ok};
      return [['Dealt one at a time',sim(true),1000,true,'Every group of four is a full squad.'],['Cut off as a block',sim(false),1000,false,'Most shuffles break at least one group.']]}},
  lastone:{intro:'The rule (biggest power of two, take it away, double it) is checked against a real down-under deal for every packet size from 2 to 52. Then the same with the card always 4th.',
    run(){const deal=n=>{let p=[...Array(n)].map((_,i)=>i+1);while(p.length>1){p.shift();if(p.length>1)p.push(p.shift())}return p[0]};const rule=n=>{const m=2**Math.floor(Math.log2(n));return n===m?n:2*(n-m)};let a=0,b=0;for(let n=2;n<=52;n++){if(deal(n)===rule(n))a++;if(deal(n)===4)b++}
      return [['Using the rule',a,51,true,'The rule predicts every size.'],['Always 4th from the top',b,51,false,'Only right for a few packet sizes, like 10.']]}},
  levelup:{intro:'A thousand random shuffled decks with the prediction 19th from the bottom. Then a thousand where they turn over the last card dealt instead of the next one.',
    run(){const sim=(next)=>{let ok=0;for(let n=0;n<1000;n++){const d=shuffle(fullDeck().map((c,i)=>({v:Math.min(RANKS.indexOf(c.r)+1,10),i})));const force=d[52-19];let pos=0,S=0;for(let p=0;p<3;p++){const v=d[pos].v;S+=v;pos+=1+(10-v)}const rem=d.slice(pos);const pick=next?rem[S]:rem[S-1];if(pick===force)ok++}return ok};
      return [['Turning the next card',sim(true),1000,true,'Always the prediction.'],['Turning the last card dealt',sim(false),1000,false,'One card early, every time.']]}},
  penalty:{intro:'Each of the 15 cards is chosen in turn. Then the same with the chosen column always gathered on top.',
    run(){const sim=(mid)=>{let ok=0;for(let s=0;s<15;s++){let idx=s;for(let r=0;r<3;r++)idx=(mid?5:0)+Math.floor(idx/3);if(idx===7)ok++}return ok};
      return [['Gathered in the middle',sim(true),15,true,'Always 8th: S-H-O-O-T-O-U-T.'],['Gathered on top',sim(false),15,false,'Ends on top instead, the 1st card.']]}},
  chaos:{intro:'A thousand random sequences of the allowed moves. Then a thousand where flipping a single card is also allowed.',
    run(){const sim=(single)=>{let ok=0;for(let n=0;n<1000;n++){let d=[...Array(10)].map((_,i)=>i%2===1);for(let m=rnd(5,30);m>0;m--){const k=rnd(0,single?3:2);if(k===0){const c=rnd(1,9);d=[...d.slice(c),...d.slice(0,c)]}else if(k===1)d=d.reverse().map(u=>!u);else if(k===2)d=[...d.slice(0,2).reverse().map(u=>!u),...d.slice(2)];else d[0]=!d[0]}
        const A=d.filter((_,i)=>i%2===0),B=d.filter((_,i)=>i%2===1);if(A.every(u=>u===A[0])&&B.every(u=>u===B[0])&&A[0]!==B[0])ok++}return ok};
      return [['Allowed moves only',sim(false),1000,true,'Always sorts perfectly.'],['Single flips allowed too',sim(true),1000,false,'One single flip breaks the pattern.']]}},
  fair:{intro:'A thousand fully random shuffles, dealt into 26 and 26. Then a thousand dealt into 25 and 27.',
    run(){const sim=(a)=>{let ok=0;for(let n=0;n<1000;n++){const d=shuffle([...Array(52)].map((_,i)=>i%2));const A=d.slice(0,a),B=d.slice(a);if(A.filter(x=>x===1).length===B.filter(x=>x===0).length)ok++}return ok};
      return [['Piles of 26 and 26',sim(26),1000,true,'Reds always equal blacks.'],['Piles of 25 and 27',sim(25),1000,false,'Uneven piles never match.']]}},
  split:{intro:'A thousand random riffles of the two prepared packets. Then a thousand where both packets run A to K.',
    run(){const sim=(mirror)=>{let ok=0;for(let n=0;n<1000;n++){const X=[...Array(13)].map((_,i)=>i),Y=mirror?[...X].reverse():[...X];const o=riffle(X,Y);if(new Set(o.slice(0,13)).size===13&&new Set(o.slice(13)).size===13)ok++}return ok};
      return [['Hearts A–K, spades K–A',sim(true),1000,true,'Both halves complete every time.'],['Both packets A–K',sim(false),1000,false,'Values double up.']]}},
  fifty:{intro:'A thousand random deals and riffles, counting an even number of cards. Then a thousand with an odd number.',
    run(){const sim=(even)=>{let ok=0;for(let n=0;n<1000;n++){let d=[...Array(52)].map((_,i)=>i%2);const c=rnd(0,51);d=[...d.slice(c),...d.slice(0,c)];const k=rnd(1,51);const o=riffle(d.slice(0,k).reverse(),d.slice(k));const e=even?2*rnd(1,25):2*rnd(1,25)-1;const red=o.slice(0,e).filter(x=>x===1).length;if(red*2===e)ok++}return ok};
      return [['Even numbers',sim(true),1000,true,'Exactly half red, always.'],['Odd numbers',sim(false),1000,false,'Can’t split an odd number in half.']]}},
  blind:{intro:'A thousand rounds of random pair flips with a random card covered. Then a thousand where single flips are allowed.',
    run(){const sim=(pairs)=>{let ok=0;for(let n=0;n<1000;n++){const u=Array(10).fill(false);for(let m=rnd(1,30);m>0;m--){if(pairs){const a=rnd(0,9);let b=rnd(0,8);if(b>=a)b++;u[a]=!u[a];u[b]=!u[b]}else{const a=rnd(0,9);u[a]=!u[a]}}const h=rnd(0,9);const vis=u.filter(x=>x).length-(u[h]?1:0);if((vis%2===1)===u[h])ok++}return ok};
      return [['Two at a time',sim(true),1000,true,'Always right.'],['One at a time',sim(false),1000,false,'Only right about half the time.']]}}
});
function renderLab(t,el){
  if(!t.lab){el.innerHTML=`<p style="margin:0">This trick depends on your hands, not on mathematics, so there is nothing to simulate. Its laboratory is a mirror: use <b>Rehearsal mode</b> in the Learn tab and watch yourself from the audience’s angle.</p>`;return}
  const L=LABS[t.lab];el.innerHTML=`<p style="margin:0 0 14px">${L.intro}</p><button class="btn" id="run">Run the experiment</button><div id="res"></div>`;
  el.querySelector('#run').onclick=()=>{const r=L.run();track('lab',t.id);el.querySelector('#res').innerHTML=`<div class="result">${r.map(x=>meter(...x)).join('')}</div>`;el.querySelector('#run').textContent='Run it again'};
}

/* ===== be-fooled games ===== */
function game21(el){
  let deck,round;
  const start=()=>{deck=shuffle(fullDeck()).slice(0,21);round=1;draw()};
  const cols=()=>{const c=[[],[],[]];deck.forEach((k,i)=>c[i%3].push(k));return c};
  function draw(){
    el.innerHTML=`<p class="msg">${round===1?'Silently choose any card and remember it. Tap the column it is in.':`Round <b>${round} of 3</b>. Find your card again and tap its column.`}</p>
    <div class="cols">${cols().map((col,k)=>`<button class="col" data-k="${k}" aria-label="Column ${k+1}">${col.map((c,j)=>card(c.r,c.s,'',`style="animation-delay:${(j*3+k)*30}ms"`)).join('')}<span class="lbl">COLUMN ${k+1}</span></button>`).join('')}</div>
    <div class="tbtns"><button class="btn line" id="r">Deal new cards</button></div>`;
    el.querySelectorAll('.col').forEach(b=>b.onclick=()=>pick(+b.dataset.k));el.querySelector('#r').onclick=start;
  }
  function pick(k){const c=cols();deck=[...c[(k+1)%3],...c[k],...c[(k+2)%3]];if(round<3){round++;draw();return}
    const t=deck[10];el.innerHTML=`<div class="reveal"><p class="msg" style="margin:0">Now the magic word, one card per letter:</p><div class="spell" id="sp" aria-live="polite"></div>${bigFlip(t)}<p class="legend" id="lg" style="visibility:hidden">Was this your card?</p><div class="tbtns"><button class="btn" id="again">Play again</button></div></div>`;
    el.querySelector('#again').onclick=start;spellOut(el,'ABRACADABRA',()=>{el.querySelector('.flip').classList.add('on');track('fooled','twenty-one');el.querySelector('#lg').style.visibility='visible'});}
  start();
}
function spellOut(el,word,done){const sp=el.querySelector('#sp');let n=0;const tick=()=>{n++;sp.textContent=word.slice(0,n);if(n<word.length)setTimeout(tick,reduceMotion()?0:150);else setTimeout(done,reduceMotion()?0:300)};tick()}

function gameKey(el){
  let deck,sel,cuts;
  function start(){deck=shuffle(fullDeck());sel=null;cuts=0;
    const offer=deck.slice(14,26);
    el.innerHTML=`<p class="msg">I’ve shuffled. Take any card from the middle of the deck.</p><div class="fanpick">${offer.map((c,k)=>`<button data-k="${k}" aria-label="Card ${k+1}" style="transform:rotate(${(k-5.5)*4}deg)">${backCard()}</button>`).join('')}</div>`;
    el.querySelectorAll('.fanpick button').forEach(b=>b.onclick=()=>{sel=offer[+b.dataset.k];deck.splice(deck.indexOf(sel),1);shown()});}
  function shown(){
    el.innerHTML=`<p class="msg">Your card is the <b>${sel.r}${SUITS[sel.s]}</b>. Remember it. I won’t look.</p><div class="reveal">${card(sel.r,sel.s,'','style="--w:100px"')}</div><div class="tbtns"><button class="btn" id="top">Put it on top of the deck</button></div>`;
    el.querySelector('#top').onclick=()=>{deck.unshift(sel);cutting()}}
  function cutting(){
    el.innerHTML=`<p class="msg">Your card is lost on top. Now cut the deck as many times as you like.</p><div class="reveal"><div style="position:relative;width:90px;height:126px">${backCard('','')}</div><p class="legend" id="cc">${cuts} cut${cuts===1?'':'s'} so far</p></div>
      <div class="tbtns"><button class="btn line" id="cut">Cut the deck</button><button class="btn" id="find" ${cuts?'':'disabled'}>Find my card</button></div>`;
    el.querySelector('.card').style.setProperty('--w','90px');
    el.querySelector('#cut').onclick=()=>{const k=rnd(8,44);deck=[...deck.slice(k),...deck.slice(0,k)];cuts++;el.querySelector('#cc').textContent=`${cuts} cut${cuts===1?'':'s'} so far`;el.querySelector('#find').disabled=false};
    el.querySelector('#find').onclick=found}
  function found(){const spread=[...deck].reverse();
    el.innerHTML=`<p class="msg">${cuts} cuts. The deck, face up:</p><div class="spread" style="justify-content:flex-start">${spread.map(c=>mini(c,c===sel?'hl':'')).join('')}</div>
      <div class="reveal" style="margin-top:8px">${bigFlip(sel)}<p class="legend">Your card. Want to know how? The answer is in Learn and Secret.</p></div><div class="tbtns"><button class="btn" id="again">Try again</button></div>`;
    setTimeout(()=>el.querySelector('.flip').classList.add('on'),reduceMotion()?0:400);el.querySelector('#again').onclick=start;track('fooled','key-card');
    const h=el.querySelector('.spread .hl');if(h)h.scrollIntoView({block:'nearest',inline:'center'});}

function gameAces(el){
  let piles,step,order;
  function start(){const d=shuffle(fullDeck().filter(c=>c.r!=='A'));const deck=[{r:'A',s:'S'},{r:'A',s:'H'},{r:'A',s:'C'},{r:'A',s:'D'},...d];
    const a=rnd(10,15),b=rnd(10,15),c=rnd(10,15);piles=[deck.slice(a+b+c),deck.slice(a+b,a+b+c),deck.slice(a,a+b),deck.slice(0,a)];step=-1;order=[0,1,2,3];draw('Here is an ordinary deck. Cut it into four piles.')}
  function draw(msg){
    el.innerHTML=`<p class="msg">${msg}</p>${step>=-1&&piles?`<div class="piles">${piles.map((p,k)=>`<div class="pile ${order[step]===k?'active':''}"><div class="stackwrap">${backCard()}</div><span class="cnt">PILE ${k+1} · ${p.length}</span></div>`).join('')}</div>`:''}
      <div class="tbtns"><button class="btn" id="go">${step===-1?'Cut into four piles':step<4?`Handle pile ${order[step]+1}`:'Turn over the top cards'}</button><button class="btn line" id="r">Start over</button></div>`;
    el.querySelectorAll('.stackwrap .card').forEach(c=>c.style.setProperty('--w','70px'));
    el.querySelector('#r').onclick=start;el.querySelector('#go').onclick=adv}
  function adv(){
    if(step===-1){step=0;draw('You cut four piles. Now, one pile at a time: move three cards from its top to its bottom, then deal one card onto each of the other piles.');return}
    if(step<4){const p=order[step];let P=piles[p];P=[...P.slice(3),...P.slice(0,3)];piles[p]=P;for(let q=0;q<4;q++)if(q!==p)piles[q].unshift(piles[p].shift());step++;
      draw(step<4?`Pile ${p+1} done: three to the bottom, one card dealt onto each other pile. Next, pile ${order[step]+1}.`:'Every pile has been mixed. I never touched a card.');return}
    el.innerHTML=`<p class="msg">Turn over the top card of each pile.</p><div class="piles">${piles.map(p=>`<div class="pile"><div class="flip" style="width:70px;height:98px"><div class="inner" style="width:70px;height:98px">${backCard()}${card(p[0].r,p[0].s,'front')}</div></div></div>`).join('')}</div><div class="tbtns"><button class="btn" id="r">Do it again</button></div>`;
    el.querySelectorAll('.card').forEach(c=>c.style.setProperty('--w','70px'));
    el.querySelectorAll('.flip').forEach((f,k)=>setTimeout(()=>f.classList.add('on'),reduceMotion()?0:250+k*300));el.querySelector('#r').onclick=start;track('fooled','aces-cut')}
  start();
}

function gameGilbreath(el){
  let st;
  function start(){const reds=shuffle(fullDeck().filter(c=>isRed(c.s))),blacks=shuffle(fullDeck().filter(c=>!isRed(c.s)));
    let d=[];for(let i=0;i<26;i++)d.push(reds[i],blacks[i]);const cut=rnd(0,51);d=[...d.slice(cut),...d.slice(0,cut)];st={stage:0,deck:d};draw()}
  const minis=cs=>`<div class="minis">${cs.map((c,i)=>mini(c,'','div',`style="animation-delay:${i*10}ms"`)).join('')}</div>`;
  function draw(){let body='',msg='';
    if(st.stage===0){msg='A deck of cards, cut at random. Look at the colours.';body=minis(st.deck)}
    if(st.stage===1){msg=`You dealt <b>${st.pile.length}</b> cards one at a time into a pile.`;body=`<div class="packets"><div><span class="label">Dealt pile</span>${minis(st.pile)}</div><div><span class="label">Rest of deck</span>${minis(st.rest)}</div></div>`}
    if(st.stage===2){msg='One genuine, random riffle shuffle. The colours look thoroughly mixed.';body=minis(st.deck)}
    if(st.stage===3){msg='Now I take them off the top, two at a time:';let h='';for(let i=0;i<st.deck.length;i+=2){const a=st.deck[i],b=st.deck[i+1];h+=`<span class="pair ${isRed(a.s)!==isRed(b.s)?'ok':'bad'}">${mini(a)}${mini(b)}</span>`}
      body=`<div class="minis">${h}</div><p class="legend">Every pair: one red, one black. Shuffle again with Start over. It never fails.</p>`}
    el.innerHTML=`<p class="msg">${msg}</p>${body}<div class="tbtns"><button class="btn" id="b0" ${st.stage!==0?'disabled':''}>Deal a pile</button><button class="btn" id="b1" ${st.stage!==1?'disabled':''}>Riffle shuffle</button><button class="btn" id="b2" ${st.stage!==2?'disabled':''}>Take pairs</button><button class="btn line" id="b3">Start over</button></div>`;
    el.querySelector('#b0').onclick=()=>{const k=rnd(18,34);st={stage:1,pile:st.deck.slice(0,k).reverse(),rest:st.deck.slice(k)};draw()};
    el.querySelector('#b1').onclick=()=>{st={stage:2,deck:riffle(st.pile,st.rest)};draw()};
    el.querySelector('#b2').onclick=()=>{st.stage=3;draw();track('fooled','red-black')};el.querySelector('#b3').onclick=start}
  start();
}

function gameSpell(el){
  let packet,pos,c;
  function start(){packet=shuffle(fullDeck()).slice(0,20);
    el.innerHTML=`<p class="msg">Here is a packet of 20 cards. Pick a number from 1 to 20. I’ll show you the card at that position.</p><div class="numgrid">${[...Array(20)].map((_,k)=>`<button data-k="${k}">${k+1}</button>`).join('')}</div>`;
    el.querySelectorAll('.numgrid button').forEach(b=>b.onclick=()=>{pos=+b.dataset.k;c=packet[pos];show()})}
  function show(){el.innerHTML=`<p class="msg">Card number ${pos+1} is the <b>${c.r}${SUITS[c.s]}</b>. Remember it.</p><div class="reveal">${card(c.r,c.s,'','style="--w:100px"')}</div><div class="tbtns"><button class="btn" id="mix">Mix the packet</button></div>`;
    el.querySelector('#mix').onclick=mix}
  function mix(){const L=lettersOf(c);let p=pos+1;
    if(p<L){const n=L-p;packet=[...packet.slice(20-n),...packet.slice(0,20-n)]}else if(p>L){const n=p-L;packet=[...packet.slice(n),...packet.slice(0,n)]}
    el.innerHTML=`<p class="msg">Mixed. Now spell your card’s name, one card per letter.</p><div class="spell" id="sp"></div><div class="minis" id="dealt" style="min-height:52px"></div>
      <div class="reveal" id="rv" style="visibility:hidden">${bigFlip(packet[L-1])}<p class="legend">The last letter. Is it yours?</p></div><div class="tbtns"><button class="btn" id="go">Spell ${nameOf(c)}</button><button class="btn line" id="r">Start over</button></div>`;
    el.querySelector('#r').onclick=start;
    el.querySelector('#go').onclick=()=>{el.querySelector('#go').disabled=true;const w=nameOf(c).replace(/ /g,'');let n=0;const sp=el.querySelector('#sp'),dl=el.querySelector('#dealt');
      const tick=()=>{n++;sp.textContent=w.slice(0,n);if(n<w.length)dl.insertAdjacentHTML('beforeend',backCard());
        if(n<w.length)setTimeout(tick,reduceMotion()?0:170);else{const rv=el.querySelector('#rv');rv.style.visibility='visible';track('fooled','spell-out');setTimeout(()=>rv.querySelector('.flip').classList.add('on'),reduceMotion()?0:300)}};tick();
      dl.querySelectorAll('.card');}}
  start();
}

/* ===== confetti ===== */
function confetti(n=70){if(reduceMotion())return;const cols=['#ef3a2a','#ffc61a','#22b04f','#fff8e7'];
  for(let i=0;i<n;i++){const c=document.createElement('span');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];
    c.style.setProperty('--d',(1.6+Math.random()*1.6)+'s');c.style.setProperty('--x',(Math.random()*200-100)+'px');c.style.setProperty('--r',(Math.random()*900-450)+'deg');c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}}

 {title:'Same trick, new face',desc:'Perform the same trick for two different people.',tip:'Notice which words got the biggest reaction, and keep them.',test:()=>{const m={};realShows().forEach(s=>m[s.trick]=(m[s.trick]||0)+1);return Object.values(m).some(v=>v>=2)}},
 {title:'Break-time show',desc:'Perform for three or more friends at once.',tip:'Pick one person to help and get the rest watching them. Groups react louder than individuals.',test:()=>realShows().some(s=>s.aud==='group'||(s.people||1)>=3)},
 {title:'The full set',desc:'Perform your three-trick set from the show builder, all in one go.',tip:'Build the set first, rehearse it twice, then go.',test:()=>realShows().some(s=>s.trick==='set')},
 {title:'Out of the house',desc:'Perform for an adult you don’t live with, like a grandparent or a family friend.',tip:'Adults love saying "I know how it’s done". Smile, and do your next trick.',test:()=>shows.some(s=>s.aud==='adult')},
 {title:'Bounce back',desc:'Keep the show going after something goes wrong.',tip:'Laugh it off, say "that was the warm-up", and go straight into your strongest trick.',test:()=>shows.some(s=>s.wrong&&s.recovered)},
 {title:'Ten fooled',desc:'Fool ten people in total.',tip:'Only count people who were truly fooled. Half guesses don’t count.',test:()=>fooledTotal()>=10,prog:()=>`${Math.min(fooledTotal(),10)} of 10 so far`},
 {title:'Stage time',desc:'Perform at an event: a talent show, assembly, club night or family party.',tip:'Ask a teacher or club leader for a slot. Bring the set you know best.',test:()=>shows.some(s=>s.aud==='event')},
 {title:'First booking',desc:'Perform at a gig someone asked you to do, with a parent or carer there.',tip:'Read the Go pro section first. It covers safety, the rules and pricing.',test:()=>shows.some(s=>s.aud==='gig')}

const currentMission=()=>MISSIONS.findIndex(m=>!m.test());
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const thisWeek=()=>realShows().filter(s=>s.at>=weekStart()).length;

 {id:'rules',title:'Know the rules',body:`<p>If you are under school leaving age (around 16; the exact date depends on where you live in the UK), performing can need a <b>child performance licence</b> from the local council, for example on licensed premises like pubs and bars, or when performing in theatre where tickets are sold.</p><ul><li>The event organiser normally applies, and your parent completes part of the form, at least 21 days before the show.</li><li>Many councils say a child can perform on up to 4 days in 6 months without a licence, as long as no school is missed. Councils explain this differently, so check.</li><li>Before your first paid gig, ask your council’s Child Employment Officer. Search “child performance licence” and your council’s name.</li><li>Most social media apps need you to be at least 13. Let a parent set up or approve any account used for bookings.</li></ul><p class="muted" style="font-size:.92rem">Example council guidance: <a href="https://www.telford.gov.uk/a_to_z/service/210/child_performance_licence" target="_blank" rel="noopener">Telford & Wrekin Council</a>. This page is general information, not legal advice.</p>`},

 {id:'gigs',title:'Pick your first gigs',body:`<p>Good places to start:</p><ul><li>Family parties and gatherings</li><li>School fairs, talent shows and assemblies</li><li>Charity and community events</li><li>Younger children’s birthday parties, with adults in charge</li><li>Youth clubs, scouts and guides</li></ul><p>Doing a few free or charity shows first builds your confidence, and you can collect kind words to share with permission.</p>`},

const FACT52='80658175170943878571660636856403766975289505440883277824000000000000';
const FACTS=[
 ['How many different orders can one deck be in?','About 8 followed by 67 zeros','That’s 52 × 51 × 50 × … × 1, written 52! and called “52 factorial”. It has 68 digits.'],
 ['Has anyone ever shuffled a deck into your exact order before?','Almost certainly not','If 8 billion people each shuffled once a second since the Big Bang, that’s only about 3.5 × 10²⁷ shuffles: a tiny speck of 52!. A well-shuffled deck is very likely a brand-new order.'],
 ['How many riffle shuffles make a deck truly random?','Seven','Dave Bayer and Persi Diaconis proved it in 1992. With fewer, patterns survive, and that’s exactly what tricks like the Red–Black Pairs exploit.'],
 ['Can shuffling put a deck back in its original order?','Yes, in 8 perfect shuffles','A perfect “out” faro shuffle splits the deck exactly in half and weaves the cards one by one, keeping the top card on top. Eight of them return 52 cards to their starting order. Perfect “in” shuffles take 52.'],
 ['Can perfect shuffles send the top card anywhere you like?','Yes, using binary','To have n cards above it, write n in binary. For each digit, left to right, do an in-shuffle for 1 and an out-shuffle for 0. This was worked out by the magician Alex Elmsley.'],
 ['Shuffle two decks and turn cards over in pairs. What’s the chance of a match?','About 63%','The chance gets very close to 1 − 1/e, where e = 2.718… is a famous maths constant. Bet a friend there will be at least one match and you’ll win nearly two times in three.'],
 ['In a shuffled deck, how likely is it that two neighbours share a value?','About 95%','Two sevens side by side, two queens side by side: it almost always happens somewhere. Most people guess it’s rare.'],
 ['What are the odds of being dealt a royal flush in five cards?','1 in 649,740','There are 2,598,960 possible five-card hands, and only four of them are royal flushes.'],
 ['How often does a random five-card hand contain at least a pair?','About 49% of the time','Just under half. The rest have five different values.'],
 ['What do all the card values in a deck add up to?','364','With ace = 1 and king = 13, each suit adds to 91, and four suits make 364. Add a joker as 1 and you get 365, the days in a year. It’s a coincidence, but people love it.'],
 ['How many different bridge deals are there?','53,644,737,765,488,792,839,237,440,000','That’s the number of ways to deal 52 cards into four hands of 13.'],
 ['Can you follow someone’s secret path through a deck without knowing where they started?','Yes, about 85% of the time','This is the Kruskal count, named after the physicist Martin Kruskal. Paths through a deck tend to merge, so your path usually lands on the same final card as theirs. Try it below.'],
 ['Which teenager ran away from home to travel with a magician, and became a top mathematician?','Persi Diaconis','He left home at 14 to travel with the card legend Dai Vernon. He later became a professor at Stanford and proved the seven-shuffle result.'],
 ['How old is the maths behind the 21-card trick?','Over 200 years','Joseph Gergonne analysed it in 1813 and showed how to send a card to any position, not just the middle.'],
 ['Can a shuffle leave hidden order behind?','Yes: the Gilbreath Principle','Norman Gilbreath discovered in the late 1950s that one riffle of a dealt pile keeps patterns like red–black alternation in every pair.'],
 ['How big a deck could the Telepathy Text trick work with?','Up to 124 cards','With the cleverest possible code, mathematicians have shown five chosen cards can signal the hidden one from a deck of up to 124.']
];
function renderMaths(){
  app.innerHTML=`<section class="part" style="margin-top:28px"><div class="label">Card maths</div><h2 style="font-size:clamp(1.8rem,5vw,2.8rem);margin-top:8px">The maths behind the magic</h2>
  <p class="sub" style="margin-top:8px">Most card tricks are maths in disguise. Here are facts hardly anyone knows, with machines to test them yourself. Tap a card to flip it.</p>
  <div class="bignum"><span class="label">Ways to order one deck: 52!</span><div class="num" id="bn" aria-live="off"></div><p class="muted" style="margin:0">That’s about 80 unvigintillion. Every time you shuffle properly, you’re almost certainly holding an order no human has ever held.</p></div>
  <div class="factgrid">${FACTS.map((f,i)=>`<button class="fact" data-i="${i}" aria-pressed="false"><span class="fi"><span class="ff"><span class="label">Fact ${i+1}</span><b>${esc(f[0])}</b><span class="tap">Tap to reveal</span></span><span class="fb"><b>${esc(f[1])}</b><span>${esc(f[2])}</span></span></span></button>`).join('')}</div>

  <p class="srcs">Sources: <a href="https://math.hmc.edu/funfacts/seven-shuffles/" target="_blank" rel="noopener">Harvey Mudd College Math Fun Facts: Seven Shuffles</a>. All other numbers on this page were calculated exactly or checked by simulation.</p></section>`;
  app.querySelectorAll('.fact').forEach(b=>b.onclick=()=>{const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);if(on)track('fact',b.dataset.i)});
  const bn=app.querySelector('#bn'),grp=FACT52.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(reduceMotion())bn.textContent=grp;else{let k=0;const tick=()=>{if(!document.body.contains(bn))return;k=Math.min(grp.length,k+2);bn.innerHTML=esc(grp.slice(0,k))+(k<grp.length?'<span>▌</span>':'');if(k<grp.length)setTimeout(tick,35)};tick()}
  faroMachine(app.querySelector('#faro'));matchLab(app.querySelector('#match'));kruskalLab(app.querySelector('#kruskal'));
}
function faroMachine(el){
  let d=[...Array(52).keys()],n=0;
  const out=a=>{const r=[];for(let i=0;i<26;i++)r.push(a[i],a[i+26]);return r},inn=a=>{const r=[];for(let i=0;i<26;i++)r.push(a[i+26],a[i]);return r};
  el.innerHTML=`<div class="bars" id="fb"></div><div class="row" style="justify-content:space-between"><span class="stat" id="fs"></span><span class="row"><button class="btn" id="fo" type="button">Out-shuffle</button><button class="btn green" id="fi" type="button">In-shuffle</button><button class="btn line" id="fr" type="button">Reset</button></span></div>
   <div class="form" style="margin-top:18px"><label>Put the top card under this many cards (1–51)<input type="number" id="en" min="1" max="51" value="10" style="width:100px"></label><button class="btn red" id="eg" type="button">Run Elmsley’s binary method</button></div><p id="em" style="margin:10px 0 0"></p>`;
  const draw=(msg)=>{el.querySelector('#fb').innerHTML=d.map(c=>`<i class="${c===0?'top':''}" style="background:hsl(${c*360/52} 85% 52%)"></i>`).join('');
    const sorted=d.every((c,i)=>c===i);el.querySelector('#fs').textContent=msg||(n?`${n} shuffle${n>1?'s':''} · ${sorted?'BACK IN ORDER!':'mixed'}`:'Starting order (white outline = original top card)');if(n&&sorted){confetti(50)}};
  el.querySelector('#fo').onclick=()=>{d=out(d);n++;draw()};el.querySelector('#fi').onclick=()=>{d=inn(d);n++;draw()};el.querySelector('#fr').onclick=()=>{d=[...Array(52).keys()];n=0;draw();el.querySelector('#em').textContent=''};
  el.querySelector('#eg').onclick=()=>{const k=Math.max(1,Math.min(51,Math.round(+el.querySelector('#en').value)||1));const bits=k.toString(2);d=[...Array(52).keys()];n=0;
    let i=0;const steps=bits.split('');const go=()=>{if(i<steps.length){d=steps[i]==='1'?inn(d):out(d);n++;i++;draw(`Binary ${bits}: ${steps.slice(0,i).map(b=>b==='1'?'IN':'OUT').join(' → ')}`);setTimeout(go,reduceMotion()?0:500)}
      else el.querySelector('#em').innerHTML=`<b style="color:var(--good)">Done.</b> ${k} in binary is ${bits}, so the shuffles were ${steps.map(b=>b==='1'?'in':'out').join(', ')}. The original top card now has exactly ${d.indexOf(0)} cards above it.`};go()};
  draw();
}
function matchLab(el){
  el.innerHTML=`<button class="btn" id="mr" type="button">Play 1,000 match games</button><div id="mo"></div>`;
  el.querySelector('#mr').onclick=()=>{let hit=0;for(let n=0;n<1000;n++){const p=shuffle([...Array(52).keys()]);if(p.some((c,i)=>c===i))hit++}
    el.querySelector('#mo').innerHTML=`<div class="result"><div class="meter"><span class="label">At least one match</span><div class="bigstat">${(hit/10).toFixed(1)}%</div><div class="bar"><i style="width:${hit/10}%;background:var(--green)"></i></div><p>Theory says 63.2%, which is 1 − 1/e. Run it again and it stays close.</p></div></div>`;el.querySelector('#mr').textContent='Play 1,000 more'};
}
function kruskalLab(el){
  el.innerHTML=`<ol style="margin:0 0 14px;padding-left:22px;display:grid;gap:4px"><li>Your friend secretly picks one of the first ten cards as a start.</li><li>They count forward by its value to a new card (aces 1, pictures 5), and keep going until the deck runs out. The last card they land on is their final card.</li><li>You do the same from the very first card, silently.</li><li>Most of the time you end on the same card, so you can “read their mind”.</li></ol><button class="btn" id="kr" type="button">Run 1,000 games</button><div id="ko"></div>`;
  el.querySelector('#kr').onclick=()=>{let hit=0;const chain=(p,s)=>{let i=s,last=s;while(i<52){last=i;i+=p[i]}return last};
    for(let n=0;n<1000;n++){const p=shuffle([...Array(52)].map((_,i)=>{const v=i%13+1;return v>10?5:v}));if(chain(p,rnd(0,9))===chain(p,0))hit++}
    el.querySelector('#ko').innerHTML=`<div class="result"><div class="meter"><span class="label">Paths that merged</span><div class="bigstat">${(hit/10).toFixed(1)}%</div><div class="bar"><i style="width:${hit/10}%;background:var(--gold)"></i></div><p>About 85%. It’s not guaranteed, so magicians keep a backup ending ready.</p></div></div>`;el.querySelector('#kr').textContent='Run 1,000 more'};
}

function renderShow(){

    const first=list[0],last=list[list.length-1],maxI=Math.max(...list.map(t=>t.impact));
    if(first.type==='Sleight of hand')adv.push(['warn',`Opening with ${first.name} means a sleight under the most attention. Open with something self-working to settle in.`]);
    else if(list.length>1&&first.impact===maxI&&last.impact<maxI)adv.push(['warn',`Your strongest trick, ${first.name}, comes first. Consider moving it to the end so the set builds.`]);

    if(list.some(t=>t.decks===2))adv.push(['info','Do As I Do needs a second deck. Have it ready in a pocket.']);
    if(setlist.includes('key-card')&&setlist.includes('do-as-i-do'))adv.push(['warn','Key Card Location and Do As I Do share the same method. A sharp viewer may spot the pattern; keep them apart or drop one.']);
    const rb=setlist.indexOf('red-black');if(rb>0)adv.push(['info','The Red–Black Pairs needs an alternating deck, so earlier tricks with shuffles will destroy it. Switch to a prepared deck before it.']);
    if(total>15)adv.push(['warn',`About ${total} minutes. Close-up sets lose energy after 15. Consider cutting one.`]);
    if(!adv.some(a=>a[0]==='warn'))adv.push(['good','No conflicts found. This set is ready to rehearse.']);
  }
  app.innerHTML=`<section class="part"><h2 style="font-size:clamp(1.8rem,4.5vw,2.6rem)">Show builder</h2><p class="sub" style="margin-top:6px">Plan a short set. The builder checks running time, setups, decks and pacing.</p>
  <div class="two"><div class="pane"><h3>Your set list</h3>${list.length?`<ol class="setlist">${list.map((t,k)=>`<li><span><b>${esc(t.name)}</b><small>${t.time} · ${t.setupKey?'Setup: '+t.setupKey.toLowerCase():'No setup'}</small></span><span class="row" style="gap:4px"><button class="mini-btn" data-a="up" data-k="${k}" aria-label="Move up" ${k===0?'disabled':''}>↑</button><button class="mini-btn" data-a="down" data-k="${k}" aria-label="Move down" ${k===list.length-1?'disabled':''}>↓</button><button class="mini-btn" data-a="rm" data-k="${k}" aria-label="Remove">✕</button></span></li>`).join('')}</ol>`:'<p class="muted">No tricks yet. Add some from the list.</p>'}
    <div class="kpis"><div class="kpi"><b>${total}</b><span>Minutes</span></div><div class="kpi"><b>${list.some(t=>t.decks===2)?2:list.length?Math.max(1,new Set(list.filter(t=>t.setupKey).map(t=>t.setupKey)).size):0}</b><span>Decks to bring</span></div></div>
    <div class="advice">${adv.map(([k,txt])=>`<div class="${k}">${esc(txt)}</div>`).join('')}</div></div>
  <div class="pane"><h3>Add a trick</h3><div class="addlist">${TRICKS.map(t=>`<div class="additem"><span>${esc(t.name)} <span class="muted" style="font-size:.88rem">· ${t.time}</span></span><button class="btn line" data-add="${t.id}" ${setlist.includes(t.id)?'disabled':''}>${setlist.includes(t.id)?'Added':'Add'}</button></div>`).join('')}</div></div></div></section>`;
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{setlist.push(b.dataset.add);saveS();renderShow()});
  app.querySelectorAll('.mini-btn').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=b.dataset.a;if(a==='rm')setlist.splice(k,1);if(a==='up'&&k>0)[setlist[k-1],setlist[k]]=[setlist[k],setlist[k-1]];if(a==='down'&&k<setlist.length-1)[setlist[k+1],setlist[k]]=[setlist[k],setlist[k+1]];saveS();renderShow()});
}

/* ===== journal ===== */
function renderJournal(){
  const total=journal.reduce((a,j)=>a+j.mins,0);const days=[];const d=new Date();for(let k=13;k>=0;k--){const x=new Date(d);x.setDate(d.getDate()-k);days.push(todayKey(x))}
  const per=days.map(k=>journal.filter(j=>j.day===k).reduce((a,j)=>a+j.mins,0));const max=Math.max(10,...per);
  const W=560,H=150,bw=W/14;
  const chart=`<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="Minutes practised over the last 14 days">
    ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H*0.9}" y2="${H-f*H*0.9}" stroke="#d6ad5c22"/><text x="${W}" y="${H-f*H*0.9-3}" fill="#b9aaa3" font-size="10" text-anchor="end" font-family="IBM Plex Mono,monospace">${Math.round(f*max)}</text>`).join('')}
    ${per.map((v,k)=>{const h=v/max*H*0.9;return `<rect x="${k*bw+6}" y="${H-h}" width="${bw-12}" height="${Math.max(h,v?2:0)}" rx="3" fill="${k===13?'#d6ad5c':'#8c6f3c'}"/>${v?`<text x="${k*bw+bw/2}" y="${H-h-4}" fill="#efe6d6" font-size="10" text-anchor="middle" font-family="IBM Plex Mono,monospace">${v}</text>`:''}`}).join('')}
    ${days.map((k,i)=>i%2===1||i===13?`<text x="${i*bw+bw/2}" y="${H+18}" fill="#b9aaa3" font-size="10" text-anchor="middle" font-family="IBM Plex Mono,monospace">${i===13?'Today':k.slice(8)}</text>`:'').join('')}</svg>`;
  const by={};journal.forEach(j=>by[j.id]=(by[j.id]||0)+j.mins);const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  app.innerHTML=`<section class="part"><h2 style="font-size:clamp(1.8rem,4.5vw,2.6rem)">Practice journal</h2><p class="sub" style="margin-top:6px">Rehearsals log themselves. Add other sessions by hand. Saved in this browser only.</p>
  <div class="kpis"><div class="kpi"><b>${streak()}</b><span>Day streak</span></div><div class="kpi"><b>${total}</b><span>Minutes total</span></div><div class="kpi"><b>${journal.length}</b><span>Sessions</span></div><div class="kpi"><b>${TRICKS.filter(t=>(mastery[t.id]||0)>=4).length}</b><span>Performed for real</span></div></div>
  <div class="diagram" style="margin:0 0 26px"><span class="label">Minutes per day · last 14 days</span>${chart}</div>
  <div class="two" style="margin-top:0"><div class="pane"><h3>Log a session</h3><div class="form"><label>Trick<select id="jt">${TRICKS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Minutes<input id="jm" type="number" min="1" max="240" value="10" style="width:90px"></label><button class="btn" id="jb">Add</button></div>
    ${top.length?`<h3 style="margin-top:28px">Time per trick</h3><table class="tbl" style="margin:0;width:100%">${top.map(([id,m])=>`<tr><td style="text-align:left">${esc(byId(id)?.name||id)}</td><td style="font-variant-numeric:tabular-nums">${m} min</td></tr>`).join('')}</table>`:''}</div>
  <div class="pane"><h3>Recent sessions</h3>${journal.length?`<ul class="log">${journal.slice(0,12).map(j=>`<li><span>${esc(byId(j.id)?.name||j.id)} <span class="muted">· ${esc(j.what)}</span></span><span>${j.day.slice(5)} · ${j.mins} min</span></li>`).join('')}</ul>`:'<p class="muted">No sessions yet. Open any trick, press <b>Start rehearsal mode</b> in its Learn tab, and your first session logs itself when you finish.</p>'}</div></div></section>`;
  app.querySelector('#jb').onclick=()=>{const v=+app.querySelector('#jm').value;if(!(v>0)){toast('Enter the minutes you practised');return}logPractice(app.querySelector('#jt').value,v,'Practice');toast('Session logged');renderJournal()};
}

/* ===== boot ===== */
updateStreak();
checkBadges(true);
const h0=(location.hash||'').slice(1);
go(h0&&(VIEWS[h0]||byId(h0))?h0:'library');
</script>
</body>
